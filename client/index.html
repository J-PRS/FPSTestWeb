<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js FPS — Tribes/Quake Style</title>
</head>
<body>
  <div id="overlay">
    <div id="cool-shots-panel">
      <h2>COOL SHOTS</h2>
      <div class="section-label">TOP 10</div>
      <div id="cool-shots-top">
        <div class="cool-shot-item empty">No cool shots yet</div>
      </div>
      <div class="section-label" style="margin-top: 20px;">RECENT 10</div>
      <div id="cool-shots-recent">
        <div class="cool-shot-item empty">No recent shots</div>
      </div>
    </div>
    <div id="overlay-center">
      <button id="start-btn">Click to Resume</button>
    </div>
    <div id="loadout-bar"></div>
    <div id="menu-side">
      <div class="menu-section">SETTINGS</div>
      <div class="btn-row">
        <button id="pixel-toggle">PIXELATED</button>
        <button id="bloom-toggle">BLOOM: OFF</button>
        <button id="postpro-toggle">POST-PROCESSING: OFF</button>
        <button id="invert-y-toggle">INVERT Y: OFF</button>
        <button id="minimap-toggle">MINIMAP: CORNER</button>
        <div class="field-row">
          <span>MODE</span>
          <select id="mode-select">
            <option value="">OFF (solo)</option>
            <option value="nuggets">NUGGET WARS 5v5</option>
            <option value="ctf">CTF 5v5</option>
            <option value="dm">DEATHMATCH ×10</option>
            <option value="classic">CLASSIC</option>
          </select>
        </div>
        <button id="spawns-toggle">SPAWNS: SCRIPTED</button>
        <button id="debug-toggle">DEBUG: OFF</button>
        <div class="field-row">
          <span>MOUSE SENS</span>
          <input id="sens-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field-row">
          <span>VOLUME</span>
          <input id="vol-input" type="range" min="0" max="1" step="0.05" />
        </div>
        <button id="keys-open">KEYBINDS</button>
      </div>
    <div id="keys-modal"></div>
  </div>
  <script type="module" src="src/main.ts"></script>
</body>
</html>
