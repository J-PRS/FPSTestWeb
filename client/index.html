<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js FPS — Tribes/Quake Style</title>
  <!-- Inline data-URI favicon — an undeclared icon makes the browser's
       automatic /favicon.ico request 404 into the console every load. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%230b1220' stroke='%233aa7ff' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%233aa7ff'/%3E%3C/svg%3E" />
  <!-- Linked, not JS-imported: stylesheet-in-JS waits on module eval →
       unstyled HTML flashes on refresh (FOUC). -->
  <link rel="stylesheet" href="/src/ui/chrome.css" />
  <link rel="stylesheet" href="/src/ui/hud/hud.css" />
  <link rel="stylesheet" href="/src/lab/lab.css" />
</head>
<body>
  <div id="overlay">
    <div id="cool-shots-panel">
      <h2>BEST SHOTS</h2>
      <div id="cool-shot-toggles">
        <button id="cs-toggle-demo" class="cs-toggle">DEMO</button>
        <button id="cs-toggle-mp4" class="cs-toggle">MP4</button>
      </div>
      <div class="section-label">TOP 10</div>
      <div id="cool-shots-top">
        <div class="cool-shot-item empty">No best shots yet</div>
      </div>
      <div class="section-label" style="margin-top: 20px;">RECENT 10</div>
      <div id="cool-shots-recent">
        <div class="cool-shot-item empty">No recent shots</div>
      </div>
    </div>
    <div id="overlay-center">
      <button id="start-btn">Click to Resume</button>
    </div>
    <div id="loadout-bar"></div>
    <div id="menu-side">
      <div class="btn-row">
        <div class="section-label">PROFILE</div>
        <div class="field-row">
          <span>NAME</span>
          <input id="name-input" type="text" maxlength="24" placeholder="display name" autocomplete="off" spellcheck="false" />
        </div>
        <div class="section-label">PERFORMANCE</div>
        <div class="btn-pair">
          <button id="autoq-toggle" class="tog">AUTO QUALITY</button>
          <button id="fpscap-toggle">FPS CAP: OFF</button>
        </div>
        <div class="field-row">
          <span>PIXEL SIZE</span>
          <div class="seg-row" id="pscale-row">
            <button data-v="1">1X</button><button data-v="2">2X</button><button data-v="3">3X</button><button data-v="4">4X</button>
          </div>
        </div>
        <div class="field-row">
          <span>PIXEL MODE</span>
          <div class="seg-row" id="pmode-row">
            <button data-v="0">RAW</button><button data-v="1">SMOOTH</button><button data-v="2">BAYER</button><button data-v="3">ATKINSON</button>
          </div>
        </div>
        <div class="section-label">DISPLAY</div>
        <div class="btn-pair">
          <button id="postpro-toggle" class="tog">POST-PROCESSING</button>
          <button id="bloom-toggle" class="tog">GLOW</button>
        </div>
        <div class="field-row">
          <span>ANTIALIAS</span>
          <div class="seg-row" id="aa-row">
            <button data-v="0">OFF</button><button data-v="1">FXAA</button><button data-v="2">SMAA</button><button data-v="3" style="display:none">MSAA 2X</button><button data-v="4" style="display:none">MSAA 4X</button>
          </div>
        </div>
        <div class="field-row">
          <span>FOV V/H</span>
          <input id="fov-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
          <input id="fov-h-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
        </div>
        <div class="section-label">CONTROLS</div>
        <div class="btn-pair">
          <div class="field-row">
            <span>MOUSE SENS</span>
            <input id="sens-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" />
          </div>
          <button id="invert-y-toggle" class="tog">INVERT Y</button>
        </div>
        <div class="btn-pair">
          <button id="keys-open">KEYBINDS</button>
          <button id="vgs-keys-toggle">VGS KEYS: LAYOUT</button>
        </div>
        <div class="section-label">AUDIO &amp; HUD</div>
        <div class="field-row">
          <span>VOLUME</span>
          <span class="vol-wrap"><input id="vol-input" type="range" min="0" max="1" step="0.05" /><span id="vol-val" class="vol-val"></span></span>
        </div>
        <div class="btn-pair">
          <button id="tts-chat-toggle" class="tog">CHAT TTS</button>
          <button id="minimap-toggle">MINIMAP: CORNER</button>
        </div>
        <div class="section-label">GAME</div>
        <button id="lobby-open">PLAY / SERVERS</button>
        <button id="leave-server" style="display:none">LEAVE SERVER</button>
        <!-- Dev tools — revealed by input.ts only on dev hosts (vite dev
             server / localhost / LAN). Hidden on public deploys. -->
        <div id="dev-tools" hidden>
          <div class="btn-pair">
            <button id="lab-open">SIM LAB</button>
            <button id="gunlab-open">GUN LAB</button>
          </div>
          <div class="btn-pair">
            <button id="spawns-toggle">SPAWNS: SCRIPTED</button>
            <button id="debug-toggle" class="tog">DEBUG</button>
          </div>
        </div>
      </div>
    </div>
    <div id="keys-modal"></div>
  </div>
  <script type="module" src="src/main.ts"></script>
</body>
</html>
