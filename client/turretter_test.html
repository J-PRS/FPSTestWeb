<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#161a22; font-family:Consolas,monospace; color:#cfd6e4; overflow:hidden }
  #title { position:absolute; top:12px; width:100%; text-align:center; font-size:15px; color:#8fa3c8 }
</style>
</head>
<body>
<div id="title">turretter &mdash; swarm bake path (bake:true, per-part self-occlusion)</div>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
// Dev tool — closed on prod builds (same https-means-prod rule as isDevHost).
if (location.protocol === 'https:') {
  document.addEventListener('DOMContentLoaded', () => {
    document.body.innerHTML = '<div style="color:#cde;font:14px monospace;padding:2em">dev tool — not available on this build.</div>';
  });
  throw new Error('dev-only surface');
}

import * as THREE from 'three';
import { turretterParts } from '/src/entities/Turretter.ts';
import { bakeVertexAO } from '/src/effects/vertexAO.ts';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161a22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 1.6, 4.2);
cam.lookAt(0, 0.8, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x8899ff, 0.6); rim.position.set(-3, 2, -4); scene.add(rim);
scene.add(new THREE.GridHelper(10, 20, 0x445066, 0x2a3242));

// Replicate swarms.ts's bake path exactly: de-index in place, one part
// per host group, bakeVertexAO(self-occlusion only).
const parts = turretterParts();
// Approximate the in-game instanceColor (0x3a4a5a gunmetal) so the bake
// reads at the brightness the turret actually renders at.
for (const p of parts) if (p.material.color) p.material.color.set(0x4a5560);
for (const p of parts) {
  if (p.geometry.index) p.geometry = p.geometry.toNonIndexed();
  const host = new THREE.Group();
  host.add(new THREE.Mesh(p.geometry, p.material));
  bakeVertexAO(host, { grime: true, wearBoost: 0.7 });
}

// Assemble a planted turret: base at origin, dome on top, barrel out.
const turret = new THREE.Group();
turret.add(new THREE.Mesh(parts[0].geometry, parts[0].material));         // base
const dome = new THREE.Mesh(parts[1].geometry, parts[1].material);        // dome
dome.position.y = 0.55;
turret.add(dome);
const barrel = new THREE.Mesh(parts[2].geometry, parts[2].material);      // barrel
barrel.position.y = 0.85;
turret.add(barrel);
const eye = new THREE.Mesh(parts[3].geometry, parts[3].material);         // eye
eye.position.set(0, 0.85, 0.55);
turret.add(eye);
scene.add(turret);

renderer.setAnimationLoop(() => renderer.render(scene, cam));
window.__ready = true;
</script>
</body>
</html>
