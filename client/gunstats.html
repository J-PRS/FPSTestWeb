<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>gunstats — weapon table</title>
  <meta name="viewport" content="width=device-width">
  <style>
    html, body { margin: 0; background: #16181d; color: #d8dde6; font: 13px/1.45 system-ui, sans-serif; }
    body { padding: 18px 22px; }
    #out { width: fit-content; margin: 0 auto; }
    h1, .sub { text-align: center; }
    h1 { font-size: 17px; margin: 0 0 16px; }
    .sub { color: #7a8aa0; font-size: 12px; margin-bottom: 14px; }
    table { border-collapse: collapse; }
    th, td { padding: 4px 12px; text-align: right; font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
    th { color: #8fd0ff; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: .06em;
         border-bottom: 1px solid #2a3342; cursor: pointer; user-select: none; position: sticky; top: 0; background: #16181d; }
    th:hover { color: #fff; }
    th.sorted { color: #ffb066; }
    td { border-bottom: 1px solid #1d232e; }
    td.l, th.l { text-align: left; }
    .clsL { color: #8fd08f; } .clsM { color: #ffb066; } .clsH { color: #ff8f8f; }
    .yes { color: #8fd08f; } .no { color: #4a5568; }
    .side { color: #7a8aa0; font-style: italic; }
    #fbar { margin-bottom: 10px; display: flex; gap: 6px; }
    #fbar button { flex: 1; background: #1d232e; color: #9fb2c8; border: 1px solid #2a3342; border-radius: 4px;
                   padding: 3px 14px; font: 11px ui-monospace, monospace; text-transform: uppercase;
                   letter-spacing: .06em; cursor: pointer; }
    #fbar button.on { background: #2a3a4d; color: #ffb066; border-color: #ffb066; }
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
             background: #2a3a4d; color: #d8dde6; border: 1px solid #ffb066; border-radius: 5px;
             padding: 5px 14px; font: 11px ui-monospace, monospace; opacity: 0;
             transition: opacity .18s; pointer-events: none; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>gunstats</h1>
  <div id="out"></div>
  <script type="module" src="/src/gunstats.ts"></script>
</body>
</html>
