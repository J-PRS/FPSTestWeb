<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#161a22; font-family:Consolas,monospace; color:#cfd6e4; overflow:hidden }
  #labels { position:absolute; bottom:12px; left:0; width:100%; display:flex; justify-content:center }
  #labels div { width:230px; text-align:center; font-size:14px; line-height:1.35 }
  #title { position:absolute; top:12px; width:100%; text-align:center; font-size:15px; color:#8fa3c8 }
</style></head><body>
<div id="title">Final class bodies — game GLBs, native clips playing (light Run_Rifle / heavy Run_gunMiddle_AR; medium rides kevdev bake in-game)</div>
<div id="labels"></div>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
// Dev tool — closed on prod builds (same https-means-prod rule as isDevHost).
if (location.protocol === 'https:') {
  document.addEventListener('DOMContentLoaded', () => {
    document.body.innerHTML = '<div style="color:#cde;font:14px monospace;padding:2em">dev tool — not available on this build.</div>';
  });
  throw new Error('dev-only surface');
}

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161a22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 1.7, 8.4); cam.lookAt(0, 1.1, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(2, 4, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x8899ff, 0.9); rim.position.set(-3, 2, -4); scene.add(rim);
scene.add(new THREE.GridHelper(14, 28, 0x445066, 0x2a3242));
for (const [y, c] of [[1.8, 0x5ac86e], [2.0, 0xe0b64f], [2.5, 0xd06a4f]]) {
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4.6, y, 0), new THREE.Vector3(4.6, y, 0)]),
    new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.4 })));
}
const models = [
  ['LIGHT — Yurowm Sci-Fi Soldier', 'class_light.glb', 0, 1.89, 'Idle_Rifle', 0.5, 1.8],
  ['MEDIUM — Vefects Vexa', 'class_medium.glb', 0, 2.2, 'Idle', 0.65, 2.0],
  ['HEAVY — SciFiWarrior Polyart', 'class_heavy.glb', 0, 2.76, 'Idle_gunMiddle_ar', 0.8, 2.5],
];
const labelEl = document.getElementById('labels');
const slots = models.map(() => { const d = document.createElement('div'); labelEl.appendChild(d); return d; });
const xs = [-2.8, 0.0, 2.8];
const mixers = [];
let pending = models.length;
models.forEach(([name, file, yaw, targetH, clipName, capR, capEye], i) => {
  new GLTFLoader().load('/public/assets/models/' + file, (g) => {
    const obj = g.scene;
    const box = new THREE.Box3().setFromObject(obj);
    const raw = box.max.y - box.min.y;
    obj.scale.setScalar(targetH / raw);
    obj.position.x = xs[i];
    obj.position.y = -box.min.y * (targetH / raw); // feet land on ground — same normalization as the game
    obj.rotation.y = yaw;
    scene.add(obj);
    if (clipName) {
      const clip = g.animations.find(c => c.name === clipName) || g.animations[0];
      const mx = new THREE.AnimationMixer(obj);
      mx.clipAction(clip).play();
      mixers.push(mx);
      slots[i].innerHTML = name + '<br>raw ' + raw.toFixed(2) + 'm → ' + targetH.toFixed(1) + 'm · cap r=' + capR + ' · ' + clip.name + ' (' + g.animations.length + ' clips)';
    } else {
      slots[i].innerHTML = name + '<br>raw ' + raw.toFixed(2) + 'm → ' + targetH.toFixed(1) + 'm · no clips (kevdev in-game)';
    }
    // Draw the class sim capsule (per-class radius, height = eye + 0.2
    // headroom) around each body — what the game actually collides.
    const capH = (capEye ?? targetH) + 0.2;
    const cap = new THREE.Mesh(
      new THREE.CapsuleGeometry(capR, Math.max(0, capH - 2 * capR), 4, 16),
      new THREE.MeshBasicMaterial({ color: 0x44ff66, wireframe: true, transparent: true, opacity: 0.45, depthTest: false }));
    cap.position.set(xs[i], capH / 2, 0);
    cap.renderOrder = 999;
    scene.add(cap);
    if (--pending === 0) {
      for (const mx of mixers) mx.update(0.4);
      renderer.render(scene, cam); window.__ready = true;
    }
  }, undefined, (e) => { window.__err = file + ': ' + String(e && e.message || e); });
});
</script></body></html>
