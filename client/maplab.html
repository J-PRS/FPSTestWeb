<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>maplab — terrain synth viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2026; }
    canvas { display: block; }
    .rail {
      position: fixed; top: 0; bottom: 0; width: 250px;
      background: rgba(10,12,16,0.9); overflow-y: auto; padding: 8px;
      font: 12px monospace; color: #cde; z-index: 10;
      scrollbar-width: none;
    }
    #rail { left: 0; }
    #rail2 { right: 0; }
    .rail::-webkit-scrollbar { display: none; }
    .rail .group { margin: 8px 0 3px; color: #8ab; border-top: 1px solid #333; padding-top: 6px; font-weight: bold; }
    .rail .row { display: flex; align-items: center; gap: 5px; margin: 3px 0; }
    .rail .row label { width: 86px; color: #9ac; flex: none; }
    .rail .row input[type=range] { flex: 1; min-width: 0; }
    .rail .row span { width: 38px; text-align: right; flex: none; color: #7d9; }
    .rail .row input[type=number], .rail .row select {
      flex: 1; min-width: 0; background: #14202e; color: #9cf;
      border: 1px solid #2a3a4a; font: inherit; padding: 2px 4px;
    }
    .rail button {
      display: block; width: 100%; margin: 3px 0; padding: 5px 8px;
      background: #1a1f26; color: #cde; border: 1px solid #333;
      text-align: left; cursor: pointer; font: inherit;
    }
    .rail button.active { background: #2d4a66; border-color: #55aaff; }
    .rail select.terrainsel {
      flex: 1; min-width: 0; margin: 0; padding: 5px 8px;
      background: #14202e; color: #9cf; border: 1px solid #55aaff;
      font: inherit; cursor: pointer;
    }
    .rail .terrnav { display: flex; gap: 4px; margin: 0 0 8px; align-items: center; }
    .rail .terrnav button { width: auto; flex: 0 0 34px; margin: 0; padding: 5px 4px; text-align: center; }
    .rail .row button.step { width: auto; flex: 0 0 20px; margin: 0; padding: 2px; text-align: center; }
    .rail .btnrow { display: flex; gap: 4px; }
    .rail .btnrow button { flex: 1; min-width: 0; padding: 5px 4px; }
    #hmview {
      position: fixed; right: 258px; bottom: 8px; width: 256px; height: 256px;
      border: 1px solid #3a4552; image-rendering: pixelated; z-index: 10;
      background: #000;
    }
    #fps {
      position: fixed; right: 258px; top: 8px; color: #7d9;
      font: 11px monospace; text-align: right; z-index: 10;
      text-shadow: 0 1px 2px #000; pointer-events: none;
    }
    #status {
      position: fixed; right: 258px; top: 24px; color: #8ab;
      font: 11px monospace; text-align: right; z-index: 10;
      text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre;
    }
    #status .hot { color: #7ddf7d; }
    #tip {
      position: fixed; z-index: 30; pointer-events: none; opacity: 0;
      background: #0d141c; border: 1px solid #2a3a4a; color: #9cf;
      font: 11px monospace; padding: 4px 7px; max-width: 220px;
      transition: opacity .12s;
    }
  </style>
</head>
<body>
  <div id="rail" class="rail"></div>
  <div id="rail2" class="rail"></div>
  <div id="tip"></div>
  <canvas id="hmview" width="257" height="257"></canvas>
  <div id="fps"></div>
  <div id="status"></div>
  <script type="module" src="src/maplab.ts"></script>
</body>
</html>
