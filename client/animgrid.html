<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>anim grid</title>
<style>
  body { margin:0; background:#14161c; font-family:Consolas,monospace; color:#cfd6e4; overflow:hidden }
  #bar { position:absolute; top:10px; left:0; width:100%; display:flex; justify-content:center; gap:6px; z-index:2 }
  #bar button { background:#232733; color:#cfd6e4; border:1px solid #3a4152; padding:5px 16px;
    font:inherit; font-size:14px; cursor:pointer; border-radius:3px }
  #bar button.on { background:#2d4a6e; border-color:#5a80b0 }
  #grid { position:absolute; inset:44px 8px 8px; display:grid; gap:6px;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); align-content:start }
  .cell { position:relative; background:#1d2029; border:1px solid #2b303d; border-radius:3px; overflow:hidden }
  .cell img { display:block; width:100%; image-rendering:auto }
  .cell .tag { position:absolute; left:6px; bottom:4px; font-size:12px; color:#8fa3c8;
    text-shadow:0 1px 2px #000 }
  .cell .miss { color:#c86a5a }
  #status { position:absolute; bottom:8px; width:100%; text-align:center; font-size:12px; color:#5a6580 }
</style>
</head>
<body>
<div id="bar"></div>
<div id="grid"></div>
<div id="status">loading…</div>
<script type="module" src="/src/animgrid.ts"></script>
</body>
</html>
