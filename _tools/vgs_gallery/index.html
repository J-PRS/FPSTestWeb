<!doctype html>
<html><head><meta charset="utf-8"><title>VGS voice gallery</title>
<style>
  :root{color-scheme:dark}
  body{font:13px/1.4 monospace;background:#111;color:#ccc;margin:16px;scrollbar-width:none}
  table{border-collapse:collapse}
  th{position:sticky;top:0;background:#111;text-align:left;padding:4px 8px;border-bottom:1px solid #444;font-size:11px}
  td{padding:2px 8px;border-bottom:1px solid #222;vertical-align:middle}
  td.chord{color:#8fc;font-weight:bold;white-space:nowrap}
  td.text{color:#999;max-width:280px}
  button{background:#222;border:1px solid #444;color:#ccc;font:inherit;padding:2px 8px;cursor:pointer}
  button:hover{background:#333}
  button.playing{background:#4a4;border-color:#6c6;color:#000}
  .stopall{margin-bottom:12px}
  .col-hint{color:#666;font-size:10px}
</style></head><body>
<button class="stopall" id="stopall">■ stop</button>
<div id="root">loading…</div>
<script src="manifest.js"></script>
<script>
const cur = new Set();
const stopAll = () => { for (const a of cur) { a.pause(); a.currentTime = 0; } cur.clear();
  document.querySelectorAll('button.playing').forEach(b => b.classList.remove('playing')); };
document.getElementById('stopall').onclick = stopAll;

(({ lines, gens } = MANIFEST) => {
  const genNames = Object.keys(gens);
  const tbl = document.createElement('table');
  tbl.innerHTML = '<tr><th>chord</th><th>line</th>' +
    genNames.map(g => `<th>${g}<br><span class="col-hint">${Object.keys(gens[g]).length} clips</span></th>`).join('') + '</tr>';
  for (const l of lines) {
    const tr = tbl.insertRow();
    tr.insertCell().outerHTML = `<td class="chord">${l.chord}</td>`;
    tr.insertCell().outerHTML = `<td class="text">${l.text}${l.note ? ' <i>(' + l.note + ')</i>' : ''}</td>`;
    for (const g of genNames) {
      const td = tr.insertCell();
      const file = gens[g][l.chord];
      if (!file) { td.textContent = '—'; continue; }
      const b = document.createElement('button');
      b.textContent = '▶';
      b.onclick = () => {
        stopAll();
        const a = new Audio(`out/${g}/${file}`);
        b.classList.add('playing');
        cur.add(a);
        a.onended = () => { cur.delete(a); b.classList.remove('playing'); };
        a.play();
      };
      td.appendChild(b);
    }
  }
  document.getElementById('root').replaceChildren(tbl);
});
</script></body></html>
