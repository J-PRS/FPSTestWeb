name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root cleanliness
        run: node utils/_rootcheck.mjs

      - uses: oven-sh/setup-bun@v2

      - name: Server tests
        working-directory: server_bun
        run: |
          bun install
          bun x tsc --noEmit
          bun test

      - name: Client checks
        working-directory: client
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npx oxlint src

      # Fails when the shipped build's files or sizes differ from the committed
      # client/dist-manifest.json, so added/removed/resized output is a decision.
      - name: Build output guard
        working-directory: client
        run: |
          npm run build
          node ../_tools/dist-manifest.mjs

      - name: Circular dependency ratchet
        run: node _tools/check-cycles.mjs

      # Headless real-browser suite. perf is excluded - software GL makes
      # absolute frame times a machine-load meter, not a regression signal.
      - name: E2E (headless Chrome)
        working-directory: _tools
        run: |
          npm ci
          bun e2e/all.ts --skip perf
